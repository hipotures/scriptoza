id = "scriptoza/rtorrent-status"
name = "rTorrent Status"
version = "0.1.0"
plugin_api = 53
author = "scriptoza"
license = "MIT"
dependencies = ["python3"]
tags = ["torrent", "status"]
icon = "download"
description = "Show local or remote rTorrent states and transfer rates in the bar."

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 460
height = 560
placement = "attached"
position = "auto"

# Read-only hover preview below the bar, wider and denser than the shell tooltip.
[[layer]]
id = "preview"
entry = "preview.luau"
layer = "overlay"
anchors = ["top", "right"]
exclusive_zone = 0
keyboard = "none"
output = "focused"
